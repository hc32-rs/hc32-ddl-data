# HC32L16x Flash 256K / SRAM 32K 的内存布局（型号：HC32L160FCUA, HC32L160FCUB, HC32L166JCTA, HC32L166JCTB…）。
# 主 SRAM 32K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 32K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 256K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 32K
  access:
    read: true
    write: true
    execute: true
