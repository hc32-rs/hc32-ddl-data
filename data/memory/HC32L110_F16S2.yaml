# HC32L110 Flash 16K / SRAM 2K 的内存布局（型号：HC32L110B4PA, HC32L110C4PA, HC32L110C4UA…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 16K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 2K
  access:
    read: true
    write: true
    execute: true
