# HC32F003 Flash 16K / SRAM 2K 的内存布局（型号：HC32F003C4PA, HC32F003C4PA, HC32F003C4PB, HC32F003C4UA…）。
# 主 SRAM 2K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 2K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 16K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 2K
  access:
    read: true
    write: true
    execute: true
