# HC32F002 Flash 18K / SRAM 2K 的内存布局（型号：HC32F002C4PB, HC32F002C4PZ, HC32F002C4UB, HC32F002C4UZ…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 18K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 2K
  access:
    read: true
    write: true
    execute: true
