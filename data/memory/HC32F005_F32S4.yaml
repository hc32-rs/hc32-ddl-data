# HC32F005 Flash 32K / SRAM 4K 的内存布局（型号：HC32F005C6PA, HC32F005C6PA, HC32F005C6PB, HC32F005C6UA…）。
# 主 SRAM 4K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 4K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 32K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 4K
  access:
    read: true
    write: true
    execute: true
