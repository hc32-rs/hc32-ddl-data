# HC32F19x Flash 256K / SRAM 32K 的内存布局（型号：HC32F190FCUA, HC32F190JCTA, HC32F196JCTA, HC32F196KCTA…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 256K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 32K
  access:
    read: true
    write: true
    execute: true
