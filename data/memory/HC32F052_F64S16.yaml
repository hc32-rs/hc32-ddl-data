# HC32F052 Flash 64K / SRAM 16K 的内存布局（型号：HC32F052F8TB, HC32F052F8UB, HC32F052J8TB, HC32F052J8UB…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 64K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 16K
  access:
    read: true
    write: true
    execute: true
