# HC32F420 Flash 128K / SRAM 24K 的内存布局（型号：HC32F420FAUB, HC32F420JATB, HC32F420JAUB, HC32F420KATB…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 128K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 24K
  access:
    read: true
    write: true
    execute: true
