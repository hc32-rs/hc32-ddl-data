# HC32L110 系列外设实例（hc32-data-tools/csv_to_yaml.py 生成）。
# 地址来自 SVD；时钟门控来自设备头 FCG/PWC 位定义；
# 引脚复用（pins）暂缺，待从数据手册 GPIO 章节补齐。
- name: ADC
  address: 0x40002400
  registers:
    kind: adc
    block: ADC
    version: v4
  rcc:
    enable:
      register: PERI_CLKEN
      field: ClkPeripheralAdcBgr
  interrupts:
  - signal: ADC
    interrupt: ADC
- name: ADT0
  address: 0x40003000
